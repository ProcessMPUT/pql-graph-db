version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: processm-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=6G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_transaction_total_max=8G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - processm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  processm:
    image: processm/processm-server-full:latest
    container_name: processm-server
    ports:
      - "80:2080"
      - "443:2443"
    networks:
      - processm-network
    environment:
      - POSTGRES_DB=processm
      - POSTGRES_USER=postgres
      - PROCESSM_DEMOMODE=true
      - PROCESSM_BASEURL=http://localhost:80/
    restart: unless-stopped


volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  processm-network:
    driver: bridge