services:
  neo4j:
    image: neo4j:5.26.25-community-ubi10
    container_name: processm-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=6G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_db_memory_transaction_total_max=8G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - processm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  processm:
    image: processm/processm-server-full:latest
    container_name: processm-server
    ports:
      - "80:2080"
      - "443:2443"
    networks:
      - processm-network
    environment:
      - POSTGRES_DB=processm
      - POSTGRES_USER=postgres
      - PROCESSM_DEMOMODE=true
      - PROCESSM_BASEURL=http://localhost:80/
      - JAVA_OPTS=-Dprocessm.logs.limit.maxUploadSize=524288000
    restart: unless-stopped
    healthcheck:
      # The unauthenticated root may legitimately answer with a non-2xx status
      # (BusyBox wget exit 8), but a refused/reset connection is exit 1.  The old
      # `!= 4` predicate therefore reported a container with an OOM-killed JVM as
      # healthy merely because PostgreSQL and PID 1 were still alive.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:2080/ 2>/dev/null; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 8 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  processm-init:
    image: python:3-slim
    container_name: processm-init
    depends_on:
      processm:
        condition: service_healthy
    networks:
      - processm-network
    volumes:
      - ./src/main/resources/logs:/xes:ro
      - ./scripts/init-processm-datastores.py:/scripts/init-processm-datastores.py:ro
    environment:
      - PROCESSM_URL=http://processm:2080/api
      - PROCESSM_LOGIN=admin@example.com
      - PROCESSM_PASSWORD=Admin1234
      - PROCESSM_ORG=TestOrg
    entrypoint: ["python3", "/scripts/init-processm-datastores.py"]
    restart: "no"

  # The interpreter under test. Containerised so the benchmark reaches both
  # systems over the same path (see Dockerfile); build the jar with
  # `./gradlew bootJar` before `docker compose up -d --build app`.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: processm-interpreter:local
    container_name: processm-interpreter
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - processm-network
    environment:
      # Inside the network Neo4j is reachable by service name, so the driver no
      # longer crosses the host boundary on every Cypher round trip.
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - PROCESSM_API_URL=http://processm:2080/api
      # JVM_HEAP_OPTS intentionally unset: the entrypoint then sizes the heap by the
      # same rule the reference implementation uses for itself (half the memory
      # available to the container). Set it only to override for an experiment.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/query/features >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped


volumes:
  neo4j_data:
    name: processm-neo4j-data
  neo4j_logs:
    name: processm-neo4j-logs
  neo4j_import:
    name: processm-neo4j-import
  neo4j_plugins:
    name: processm-neo4j-plugins

networks:
  processm-network:
    driver: bridge
