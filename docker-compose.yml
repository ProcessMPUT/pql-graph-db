version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: processm-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=6G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_memory_transaction_total_max=8G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - processm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1'"]
      interval: 30s
      timeout: 10s
      retries: 5

  processm:
    image: processm/processm-server-full:latest
    container_name: processm-server
    ports:
      - "80:2080"
      - "443:2443"
    networks:
      - processm-network
    environment:
      - POSTGRES_DB=processm
      - POSTGRES_USER=postgres
      - PROCESSM_DEMOMODE=true
      - PROCESSM_BASEURL=http://localhost:80/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2080/api/users/session || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  processm-init:
    image: python:3-slim
    container_name: processm-init
    depends_on:
      processm:
        condition: service_healthy
    networks:
      - processm-network
    environment:
      - PROCESSM_URL=http://processm:2080/api
      - PROCESSM_LOGIN=admin@example.com
      - PROCESSM_PASSWORD=Admin1234
      - PROCESSM_ORG=TestOrg
    entrypoint: ["python3", "-c", """
import urllib.request, urllib.error, json, os, sys, time

url = os.environ.get('PROCESSM_URL', 'http://processm:2080/api')
email = os.environ.get('PROCESSM_LOGIN', 'admin@example.com')
pwd = os.environ.get('PROCESSM_PASSWORD', 'Admin1234')
org = os.environ.get('PROCESSM_ORG', 'TestOrg')

def post(path, data):
    req = urllib.request.Request(f'{url}{path}', json.dumps(data).encode(), {'Content-Type': 'application/json'})
    try:
        with urllib.request.urlopen(req) as r:
            return json.loads(r.read()), r.status
    except urllib.error.HTTPError as e:
        return json.loads(e.read()), e.code

# Try login first
resp, code = post('/users/session', {'login': email, 'password': pwd})
if 'authorizationToken' in resp:
    print(f'User {email} already exists. Done.')
    sys.exit(0)

# Create user
print(f'Creating user {email}...')
resp, code = post('/users', {'userEmail': email, 'userPassword': pwd, 'newOrganization': True, 'organizationName': org})
if code == 201 or 'already exists' in resp.get('error', ''):
    print('User created (or already exists).')
else:
    print(f'Create response ({code}): {resp}')

# Verify
resp, code = post('/users/session', {'login': email, 'password': pwd})
if 'authorizationToken' in resp:
    print('Login verified OK.')
else:
    print(f'Login failed: {resp}')
    sys.exit(1)
"""]
    restart: "no"


volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  processm-network:
    driver: bridge