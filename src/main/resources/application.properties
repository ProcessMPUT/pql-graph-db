spring.application.name=processm-interpreter

# Server configuration
server.port=8080
# Connection timeout for large file uploads (10 minutes)
server.tomcat.connection-timeout=600000
# Keep-alive timeout
server.tomcat.keep-alive-timeout=300000

# Neo4j configuration
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password123
spring.neo4j.pool.metrics-enabled=true
spring.neo4j.pool.log-leaked-sessions=true
spring.neo4j.pool.max-connection-pool-size=50
spring.neo4j.pool.idle-time-before-connection-test=PT30S
spring.neo4j.pool.max-connection-lifetime=PT1H

# Logging configuration
logging.level.org.neo4j.driver=INFO
logging.level.com.processm.processminterpreter=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG

# Spring Boot multipart file upload configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=${processm.xes.upload.temp-directory}

# Application specific configuration
processm.xes.upload.max-file-size=500MB
processm.xes.upload.temp-directory=./temp/xes-uploads
processm.xes.upload.enable-gzip=true
# Increased timeout for processing large files (5 minutes)
processm.query.timeout=PT5M
processm.query.max-results=10000

# ProcessM API Configuration (Local Docker)
processm.api.url=http://localhost:80/api
# Default credentials for standard image
processm.login=admin@example.com
processm.password=Admin1234

# PQL Parser configuration
# Options: antlr (default, recommended), regex (legacy)
pql.parser.type=antlr

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
