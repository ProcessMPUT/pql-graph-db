# Edited by hand after the scripts were ported from PowerShell to Python.
# The generator's header claimed this file was autogenerated, but all three
# actions had gone stale: they invoked `powershell`, which is absent on macOS
# and Linux, and "Verify Compatibility" pointed at scripts/verify-compatibility.ps1,
# a script that no longer exists. If the Codex UI regenerates this file, re-apply
# these commands.
version = 1
name = "pql-graph-db"

[setup]
script = ""

[[actions]]
name = "Restart"
icon = "run"
command = "python3 scripts/restart-app-8080.py --port 8080"

[[actions]]
name = "Stop"
icon = "tool"
command = "python3 scripts/stop-app-8080.py --port 8080"

[[actions]]
name = "Verify Compatibility"
icon = "run"
command = "python3 scripts/run-compatibility-report.py --query-source matrix --profile quick --skip-failure-snapshots"
